server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # 1. จัดการ Backend API 
    location /network-management/8001/api/ {
        # Backend run at port 4000
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ API ที่ใช้เวลาประมวลผลนาน เช่น Replace Device
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # จัดการกรณีไม่มี trailing slash
    location = /network-management/8001 {
        return 301 /network-management/8001/;
    }

    # 2. จัดการ Frontend Page
    # ใช้ trailing slash เพื่อตัด /network-management/8001 ออกก่อนส่งให้ Frontend
    location /network-management/8001/ {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # รองรับ URL เก่า (Redirect 8100 -> 8001)
    location /network-management/8100 {
        return 301 /network-management/8001/;
    }

    # 3. อำนวยความสะดวก (Redirect)
    location = / {
        return 302 /network-management/8001/;
    }
}
