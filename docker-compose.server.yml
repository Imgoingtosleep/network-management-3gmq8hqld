version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netops-server-backend
    restart: always
    env_file:
      - .env.server
    networks:
      - netops-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - ENV_FILE=.env.server
    container_name: netops-server-frontend
    restart: always
    env_file:
      - .env.server
    depends_on:
      - backend 
    networks:
      - netops-network

  nginx:
    image: nginx:alpine
    container_name: netops-server-nginx
    restart: always
    ports:
      - "8100:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - netops-network

networks:
  netops-network:
    driver: bridge
